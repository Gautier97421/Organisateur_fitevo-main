packages:
  - "."

# Réglages pnpm. Depuis pnpm 11, c'est ce fichier qui fait foi : les clés
# équivalentes de .npmrc (node-linker, shamefully-hoist, auto-install-peers…)
# n'y sont plus lues. .npmrc est conservé pour les postes encore en pnpm 10.
nodeLinker: hoisted
shamefullyHoist: true
autoInstallPeers: true
strictPeerDependencies: false

# Scripts d'installation autorisés (pnpm 11). Les valeurs doivent être des
# booléens : laissées en texte (« set this to true or false »), pnpm considère
# l'approbation comme non résolue, ignore les builds et échoue avec
# ERR_PNPM_IGNORED_BUILDS — ce qui cassait l'installation dans l'image Docker.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true

# Équivalent pour pnpm 10, qui ne connaît pas allowBuilds.
onlyBuiltDependencies:
  - sharp
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - core-js

overrides:
  picomatch: ">=4.0.4"
  lodash: ">=4.18.0"
  defu: ">=6.1.5"
  postcss: ">=8.5.18"
  uuid: ">=11.1.1"
  brace-expansion: ">=2.1.3"
  linkify-it: ">=5.0.2"
  dompurify: ">=3.4.12"
  sharp: ">=0.35.0"
  effect: ">=3.20.0"
