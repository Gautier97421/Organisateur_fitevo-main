# Docker Compose - Configuration DÉVELOPPEMENT
# Pour la production, utilisez docker-compose.prod.yml
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitevo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Accessible uniquement en local sur le serveur (pas exposé à Internet)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fitevo_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitevo-web
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Port hôte 3000 (Docker Desktop WSL2 gère le forwarding IPv4+IPv6)
      - "3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - UPLOAD_DIR=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma
      - uploads_dev_data:/app/uploads
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fitevo_internal
      - npm_network

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitevo-prisma-studio
    restart: always
    ports:
      # Prisma Studio accessible uniquement en local (tunnel SSH requis pour y accéder)
      - "127.0.0.1:5557:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./prisma:/app/prisma
    command: ["pnpm", "prisma:studio", "--browser", "none", "--port", "5555"]
    # 512m est trop bas : pnpm lui-même (vérification du lockfile avant de lancer le script)
    # a besoin de plus de mémoire que ça, ce qui provoquait un OOM en boucle au démarrage.
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fitevo_internal

volumes:
  postgres_data:
  uploads_dev_data:

networks:
  fitevo_internal:
    driver: bridge
  npm_network:
    external: true
    name: npm_network